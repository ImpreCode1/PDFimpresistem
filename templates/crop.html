<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Recortar PDF — PDF Impresistem</title>
    <link rel="stylesheet" href="/static/css/impresistem-ui.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
    <style>
        #cropCanvas {
            background: #fff;
            border-radius: 4px;
            display: block;
            width: 100%;
        }
        .warning-box {
            background: rgba(220,38,38,0.08);
            border: 1px solid rgba(220,38,38,0.2);
            border-radius: 7px;
            padding: 9px 11px;
            font-size: 12px;
            color: rgba(248,113,113,0.9);
            margin-bottom: 9px;
            line-height: 1.5;
        }
        .margin-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
        }
        .margin-grid .prop-label {
            font-size: 10px;
            margin-bottom: 3px;
        }
        .margin-grid .prop-input {
            margin-bottom: 0;
        }
    </style>
</head>
<body>
    <div id="sidebar">
        <div class="sidebar-header">
            <div class="sidebar-logo">
                <div class="logo-dot">im</div>
                <span class="logo-label">PDF Impresistem</span>
            </div>
            <h1 class="sidebar-title">Recortar PDF</h1>
        </div>

        <!-- Archivo -->
        <div class="sidebar-section">
            <span class="section-label">Archivo PDF</span>
            <input type="file" id="pdfInput" accept=".pdf" style="display:none;">
            <div class="file-upload-zone" onclick="document.getElementById('pdfInput').click()">
                <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"/>
                </svg>
                <p><strong id="uploadLabel">Seleccionar PDF</strong></p>
            </div>
        </div>

        <!-- Página -->
        <div class="sidebar-section">
            <span class="section-label">Página</span>
            <div class="page-control">
                <button class="page-nav-btn" onclick="changePageNum(-1)">‹</button>
                <input type="number" id="pageNum" value="1" min="1" class="page-num-input">
                <span class="page-total-label" id="pageTotalLabel"></span>
                <button class="page-nav-btn" onclick="changePageNum(1)">›</button>
            </div>
        </div>

        <!-- Márgenes -->
        <div class="sidebar-section">
            <span class="section-label">Márgenes</span>
            <div class="margin-grid">
                <div>
                    <label class="prop-label">Izquierdo (%)</label>
                    <input type="number" id="margen_izq" value="0" min="0" max="40" class="prop-input">
                </div>
                <div>
                    <label class="prop-label">Derecho (%)</label>
                    <input type="number" id="margen_der" value="0" min="0" max="40" class="prop-input">
                </div>
                <div>
                    <label class="prop-label">Superior (%)</label>
                    <input type="number" id="margen_sup" value="0" min="0" max="40" class="prop-input">
                </div>
                <div>
                    <label class="prop-label">Inferior (%)</label>
                    <input type="number" id="margen_inf" value="0" min="0" max="40" class="prop-input">
                </div>
            </div>
        </div>

        <!-- Warning -->
        <div id="warningArea" style="display:none;" class="warning-box">
            Los márgenes combinados no pueden superar el 100%
        </div>

        <!-- Hidden inputs -->
        <input type="hidden" name="margen_izq" id="margen_izq_hidden">
        <input type="hidden" name="margen_der" id="margen_der_hidden">
        <input type="hidden" name="margen_sup" id="margen_sup_hidden">
        <input type="hidden" name="margen_inf" id="margen_inf_hidden">

        <div style="flex:1;"></div>

        <div class="sidebar-footer">
            <button type="button" id="cropBtn" onclick="cropPDF()" disabled class="btn-primary">
                Recortar PDF
            </button>
            <button type="button" id="resetBtn" onclick="resetCrop()" disabled class="btn-secondary">
                Restablecer
            </button>
            <div id="downloadArea" style="display:none;">
                <div class="download-area">
                    <span class="download-title">PDF recortado</span>
                    <a id="downloadLink" href="#" download class="download-link">Descargar PDF</a>
                </div>
            </div>
        </div>
    </div>

    <div id="mainArea">
        <div class="main-topbar">
            <span class="main-hint">Ajusta los márgenes de recorte arrastrando el rectángulo sobre el PDF</span>
            <span class="main-info" id="zoomLabel">595 × 842 pt</span>
        </div>
        <div class="main-wrapper">
            <div class="canvas-card">
                <canvas id="cropCanvas"></canvas>
            </div>
        </div>
        <div class="status-bar">
            <div class="status-item"><div class="status-dot"></div> Listo</div>
            <div class="status-item" id="statusMargins">M: 0 0 0 0</div>
            <div class="status-item" id="statusPage">Pág 1</div>
        </div>
    </div>

    <script>
        let canvas;
        let cropRect;
        let pdfBase64 = null;
        let canvasWidth = 595;
        let canvasHeight = 842;
        let pageCount = 1;

        const pdfInput = document.getElementById('pdfInput');
        const pageNum = document.getElementById('pageNum');
        const cropBtn = document.getElementById('cropBtn');
        const resetBtn = document.getElementById('resetBtn');
        const warningArea = document.getElementById('warningArea');
        const downloadArea = document.getElementById('downloadArea');
        const downloadLink = document.getElementById('downloadLink');

        const marginInputs = {
            izq: document.getElementById('margen_izq'),
            der: document.getElementById('margen_der'),
            sup: document.getElementById('margen_sup'),
            inf: document.getElementById('margen_inf')
        };

        function initCanvas() {
            canvas = new fabric.Canvas('cropCanvas', {
                selection: false
            });
            canvas.setDimensions({ width: canvasWidth, height: canvasHeight });
            canvas.renderAll();
        }

        function createCropOverlay() {
            canvas.clear();
            
            if (!pdfBase64) {
                canvas.renderAll();
                return;
            }

            fabric.Image.fromURL(pdfBase64, function(img) {
                canvas.setBackgroundImage(img, canvas.renderAll.bind(canvas), {
                    scaleX: canvasWidth / img.width,
                    scaleY: canvasHeight / img.height
                });

                updateCropRect();
            });
        }

        function updateCropRect() {
            const existing = canvas.getObjects().filter(o => o.isCropRect);
            existing.forEach(o => canvas.remove(o));

            const mIzq = parseInt(marginInputs.izq.value) || 0;
            const mSup = parseInt(marginInputs.sup.value) || 0;
            const mDer = parseInt(marginInputs.der.value) || 0;
            const mInf = parseInt(marginInputs.inf.value) || 0;

            const left = (mIzq / 100) * canvasWidth;
            const top = (mSup / 100) * canvasHeight;
            const width = canvasWidth - left - (mDer / 100) * canvasWidth;
            const height = canvasHeight - top - (mInf / 100) * canvasHeight;

            const overlayColor = 'rgba(0, 0, 0, 0.5)';
            
            const topOverlay = new fabric.Rect({
                left: 0, top: 0,
                width: canvasWidth, height: top,
                fill: overlayColor, selectable: false, evented: false,
                isCropRect: true
            });
            
            const bottomOverlay = new fabric.Rect({
                left: 0, top: top + height,
                width: canvasWidth, height: canvasHeight - top - height,
                fill: overlayColor, selectable: false, evented: false,
                isCropRect: true
            });
            
            const leftOverlay = new fabric.Rect({
                left: 0, top: top,
                width: left, height: height,
                fill: overlayColor, selectable: false, evented: false,
                isCropRect: true
            });
            
            const rightOverlay = new fabric.Rect({
                left: left + width, top: top,
                width: canvasWidth - left - width, height: height,
                fill: overlayColor, selectable: false, evented: false,
                isCropRect: true
            });

            cropRect = new fabric.Rect({
                left: left, top: top,
                width: width, height: height,
                fill: 'transparent',
                stroke: '#2563eb',
                strokeWidth: 2,
                strokeDashArray: [5, 5],
                selectable: true,
                hasControls: true,
                hasBorders: false,
                lockRotation: true,
                lockScalingFlip: true,
                isCropRect: true
            });

            canvas.add(topOverlay, bottomOverlay, leftOverlay, rightOverlay, cropRect);
            canvas.renderAll();

            cropRect.on('moving', function() {
                const obj = this;
                obj.set({
                    left: Math.max(0, Math.min(canvasWidth - obj.width, obj.left)),
                    top: Math.max(0, Math.min(canvasHeight - obj.height, obj.top))
                });
                updateMarginsFromRect();
            });

            cropRect.on('scaling', function() {
                const obj = this;
                const scaleX = obj.scaleX;
                const scaleY = obj.scaleY;
                
                obj.set({
                    width: obj.width * scaleX,
                    height: obj.height * scaleY,
                    scaleX: 1,
                    scaleY: 1,
                    left: Math.max(0, Math.min(canvasWidth - obj.width, obj.left)),
                    top: Math.max(0, Math.min(canvasHeight - obj.height, obj.top))
                });
                updateMarginsFromRect();
            });

            updateHiddenInputs();
            validateMargins();
        }

        function updateMarginsFromRect() {
            if (!cropRect) return;

            const rect = cropRect;
            const left = rect.left;
            const top = rect.top;
            const width = rect.getScaledWidth();
            const height = rect.getScaledHeight();

            marginInputs.izq.value = Math.round((left / canvasWidth) * 100);
            marginInputs.sup.value = Math.round((top / canvasHeight) * 100);
            marginInputs.der.value = Math.round(((canvasWidth - left - width) / canvasWidth) * 100);
            marginInputs.inf.value = Math.round(((canvasHeight - top - height) / canvasHeight) * 100);

            updateHiddenInputs();
            validateMargins();
        }

        function updateHiddenInputs() {
            document.getElementById('margen_izq_hidden').value = marginInputs.izq.value;
            document.getElementById('margen_der_hidden').value = marginInputs.der.value;
            document.getElementById('margen_sup_hidden').value = marginInputs.sup.value;
            document.getElementById('margen_inf_hidden').value = marginInputs.inf.value;
        }

        function validateMargins() {
            const mIzq = parseInt(marginInputs.izq.value) || 0;
            const mDer = parseInt(marginInputs.der.value) || 0;
            const mSup = parseInt(marginInputs.sup.value) || 0;
            const mInf = parseInt(marginInputs.inf.value) || 0;

            const valid = (mIzq + mDer < 100) && (mSup + mInf < 100);
            
            if (!valid) {
                warningArea.style.display = 'block';
            } else {
                warningArea.style.display = 'none';
            }
            
            return valid;
        }

        function resetCrop() {
            marginInputs.izq.value = 0;
            marginInputs.der.value = 0;
            marginInputs.sup.value = 0;
            marginInputs.inf.value = 0;
            updateHiddenInputs();
            validateMargins();
            updateCropRect();
        }

        async function fetchPagePreview() {
            if (!pdfInput.files[0]) return;
            
            const formData = new FormData();
            formData.append('pdf_file', pdfInput.files[0]);
            formData.append('pagina', pageNum.value);
            
            try {
                const response = await fetch('/api/page_preview', {
                    method: 'POST',
                    body: formData
                });
                const data = await response.json();
                
                if (data.image) {
                    pdfBase64 = data.image;
                    const img = new Image();
                    img.onload = function() {
                        const maxW = 800, maxH = 800;
                        let scale = Math.min(maxW / img.width, maxH / img.height, 1);
                        canvasWidth = img.width * scale;
                        canvasHeight = img.height * scale;
                        canvas.setDimensions({ width: canvasWidth, height: canvasHeight });
                        createCropOverlay();
                    };
                    img.src = pdfBase64;
                    cropBtn.disabled = false;
                    resetBtn.disabled = false;
                }
            } catch (e) {
                console.error('Error fetching page preview:', e);
            }
        }

        async function cropPDF() {
            if (!pdfInput.files[0]) return;
            
            if (!validateMargins()) {
                alert('Los márgenes no son válidos');
                return;
            }
            
            const formData = new FormData();
            formData.append('pdf_file', pdfInput.files[0]);
            formData.append('margen_izq', marginInputs.izq.value);
            formData.append('margen_der', marginInputs.der.value);
            formData.append('margen_sup', marginInputs.sup.value);
            formData.append('margen_inf', marginInputs.inf.value);
            
            try {
                const response = await fetch('/crop', {
                    method: 'POST',
                    body: formData
                });
                
                if (response.ok) {
                    const result = await response.text();
                    const parser = new DOMParser();
                    const doc = parser.parseFromString(result, 'text/html');
                    const link = doc.querySelector('a[download]');
                    
                    if (link) {
                        downloadLink.href = link.getAttribute('href');
                        downloadLink.download = link.download;
                        downloadArea.style.display = 'block';
                    }
                }
            } catch (e) {
                console.error('Error cropping PDF:', e);
            }
        }

        pdfInput.addEventListener('change', function() {
            if (this.files[0]) {
                document.getElementById('uploadLabel').textContent = this.files[0].name;
                fetchPagePreview();
            }
        });

        pageNum.addEventListener('change', function() {
            if (pdfInput.files[0]) {
                fetchPagePreview();
            }
        });

        Object.values(marginInputs).forEach(input => {
            input.addEventListener('input', function() {
                if (validateMargins()) {
                    updateCropRect();
                }
            });
        });

        initCanvas();

        function changePageNum(delta) {
            const input = document.getElementById('pageNum');
            const newVal = Math.max(1, parseInt(input.value) + delta);
            input.value = newVal;
            if (pdfInput.files[0]) fetchPagePreview();
        }

        const origValidateMargins = validateMargins;
        window.validateMargins = function() {
            const mIzq = parseInt(marginInputs.izq.value) || 0;
            const mDer = parseInt(marginInputs.der.value) || 0;
            const mSup = parseInt(marginInputs.sup.value) || 0;
            const mInf = parseInt(marginInputs.inf.value) || 0;

            const valid = (mIzq + mDer < 100) && (mSup + mInf < 100);

            warningArea.style.display = valid ? 'none' : 'block';

            return valid;
        };

        const origCropPDF = cropPDF;
        window.cropPDF = async function() {
            if (!pdfInput.files[0]) return;

            if (!validateMargins()) {
                alert('Los márgenes no son válidos');
                return;
            }

            const formData = new FormData();
            formData.append('pdf_file', pdfInput.files[0]);
            formData.append('margen_izq', marginInputs.izq.value);
            formData.append('margen_der', marginInputs.der.value);
            formData.append('margen_sup', marginInputs.sup.value);
            formData.append('margen_inf', marginInputs.inf.value);

            try {
                const response = await fetch('/crop', {
                    method: 'POST',
                    body: formData
                });

                if (response.ok) {
                    const result = await response.text();
                    const parser = new DOMParser();
                    const doc = parser.parseFromString(result, 'text/html');
                    const link = doc.querySelector('a[download]');

                    if (link) {
                        downloadLink.href = link.getAttribute('href');
                        downloadLink.download = link.download;
                        downloadArea.style.display = 'block';
                    }
                }
            } catch (e) {
                console.error('Error cropping PDF:', e);
            }
        };
    </script>
</body>
</html>
