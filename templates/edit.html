<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Editar PDF — PDF Impresistem</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
    <style>
        #editCanvas {
            border: 1px solid #e5e7eb;
        }
        .tool-active {
            background-color: #3b82f6;
            color: white;
        }
    </style>
</head>
<!-- FIX CRITICAL: Layout renders below expected area - added flex-col + flex-1 -->
<body class="bg-gray-50 min-h-screen flex flex-col">
    <div class="flex-1 flex h-screen">
        <!-- Left Panel -->
        <div class="w-80 bg-white border-r border-gray-200 p-5 flex flex-col overflow-y-auto">
            <h1 class="text-xl font-bold text-gray-800 mb-4">Editar PDF</h1>
            
            <!-- Upload PDF -->
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-1">Archivo PDF</label>
                <input type="file" id="pdfInput" accept=".pdf" 
                    class="w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-sm file:font-semibold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100">
            </div>

            <!-- Page Selector -->
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-1">Página</label>
                <input type="number" id="pageNum" value="1" min="1" 
                    class="w-full border border-gray-300 rounded-xl py-2 px-3 text-gray-700 focus:outline-none focus:border-indigo-400">
                <p id="pageCountDisplay" class="text-xs text-gray-500 mt-1 hidden">de <span id="totalPages">1</span> páginas</p>
            </div>

            <!-- Tool Selector -->
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-2">Herramienta</label>
                <div class="flex flex-wrap gap-2">
                    <button type="button" id="toolText" onclick="selectTool('text')"
                        class="flex-1 bg-gray-200 hover:bg-gray-300 text-gray-700 font-medium py-2 px-3 rounded-lg text-sm tool-active">
                        T Texto
                    </button>
                    <button type="button" id="toolSelect" onclick="selectTool('select')"
                        class="flex-1 bg-gray-200 hover:bg-gray-300 text-gray-700 font-medium py-2 px-3 rounded-lg text-sm">
                        ↖ Mover
                    </button>
                    <button type="button" id="toolRect" onclick="selectTool('rect')"
                        class="flex-1 bg-gray-200 hover:bg-gray-300 text-gray-700 font-medium py-2 px-3 rounded-lg text-sm">
                        ▭ Rect
                    </button>
                    <button type="button" id="toolHighlight" onclick="selectTool('highlight')"
                        class="flex-1 bg-gray-200 hover:bg-gray-300 text-gray-700 font-medium py-2 px-3 rounded-lg text-sm">
                        ◼ Resaltar
                    </button>
                    <button type="button" id="toolDelete" onclick="deleteSelected()"
                        class="flex-1 bg-red-100 hover:bg-red-200 text-red-700 font-medium py-2 px-3 rounded-lg text-sm">
                        🗑 Eliminar
                    </button>
                </div>
            </div>

            <!-- Text Settings -->
            <div class="mb-4 space-y-3">
                <div>
                    <label class="block text-xs font-medium text-gray-600 mb-1">Tamaño de fuente</label>
                    <input type="number" id="fontSize" value="12" min="6" max="72" 
                        class="w-full border border-gray-300 rounded-lg py-2 px-3 text-gray-700 focus:outline-none focus:border-indigo-400">
                </div>
                <div>
                    <label class="block text-xs font-medium text-gray-600 mb-1">Color</label>
                    <input type="color" id="textColor" value="#000000" 
                        class="w-full h-10 border border-gray-300 rounded-lg cursor-pointer">
                </div>
            </div>

            <!-- Annotation List -->
            <div class="mb-4 flex-1 overflow-auto">
                <label class="block text-sm font-medium text-gray-700 mb-2">Anotaciones</label>
                <div id="annotationList" class="space-y-2">
                    <p class="text-xs text-gray-400">Haz clic en el canvas para agregar texto</p>
                </div>
            </div>

            <!-- Hidden input -->
            <input type="hidden" name="anotaciones" id="anotaciones_input">

            <!-- Buttons -->
            <button type="button" id="saveBtn" onclick="saveChanges()" disabled
                class="w-full bg-indigo-600 hover:bg-indigo-700 disabled:bg-gray-300 disabled:cursor-not-allowed text-white font-semibold py-3 px-6 rounded-xl mb-2 transition-all duration-200">
                Guardar cambios
            </button>

            <!-- Download Link -->
            <div id="downloadArea" class="mt-4 hidden">
                <h3 class="text-lg font-bold text-green-700 mb-2">PDF editado</h3>
                <a id="downloadLink" href="#" download class="text-blue-600 hover:underline">
                    Descargar PDF
                </a>
            </div>
        </div>

        <!-- Main Canvas Area -->
        <div class="flex-1 p-5 overflow-auto flex items-center justify-center bg-gray-100">
            <div class="bg-white rounded-xl shadow-lg p-4">
                <canvas id="editCanvas"></canvas>
            </div>
        </div>
    </div>

    <script>
        let canvas;
        let pdfBase64 = null;
        let canvasWidth = 595;
        let canvasHeight = 842;
        let currentPage = 1; // siempre entero
        let totalPages = 1;
        let pageAnnotations = {};
        let currentTool = 'text';
        let pdfTextBlocks = [];
        let canvasScale = 1.0;

        const pdfInput = document.getElementById('pdfInput');
        const pageNum = document.getElementById('pageNum');
        const pageCountDisplay = document.getElementById('pageCountDisplay');
        const totalPagesSpan = document.getElementById('totalPages');
        const fontSizeInput = document.getElementById('fontSize');
        const textColorInput = document.getElementById('textColor');
        const annotationList = document.getElementById('annotationList');
        const saveBtn = document.getElementById('saveBtn');
        const downloadArea = document.getElementById('downloadArea');
        const downloadLink = document.getElementById('downloadLink');

        function initCanvas() {
            canvas = new fabric.Canvas('editCanvas', {
                selection: true
            });
            canvas.setDimensions({ width: canvasWidth, height: canvasHeight });
            canvas.renderAll();

            canvas.on('mouse:down', function(options) {
                const pointer = canvas.getPointer(options.e);
                if (currentTool === 'text' && !options.target) {
                    const existingBlock = findTextBlockAt(pointer.x, pointer.y);
                    if (existingBlock) {
                        addTextOverlay(existingBlock);
                    } else {
                        addText(pointer.x, pointer.y);
                    }
                } else if (currentTool === 'rect' && !options.target) {
                    addRect(pointer.x, pointer.y);
                } else if (currentTool === 'highlight' && !options.target) {
                    addHighlight(pointer.x, pointer.y);
                }
            });
        }

        function addText(x, y) {
            const text = new fabric.IText('Texto', {
                left: x,
                top: y,
                fontSize: parseInt(fontSizeInput.value) || 12,
                fill: textColorInput.value,
                fontFamily: 'Arial'
            });
            
            text.on('changed', function() {
                updateAnnotationList();
            });
            
            canvas.add(text);
            canvas.setActiveObject(text);
            text.enterEditing();
            updateAnnotationList();
        }

        function findTextBlockAt(x, y) {
            for (const block of pdfTextBlocks) {
                if (x >= block.x0 && x <= block.x1 && y >= block.y0 && y <= block.y1) {
                    return block;
                }
            }
            return null;
        }

        function addTextOverlay(block) {
            const width = block.x1 - block.x0;
            const height = block.y1 - block.y0;

            // Rectángulo blanco que tapa el texto original
            const cover = new fabric.Rect({
                left: block.x0,
                top: block.y0,
                width: width + 4,
                height: height + 4,
                fill: 'white',
                stroke: 'transparent',
                strokeWidth: 0,
                selectable: false,
                evented: false,
                customType: 'cover'
            });

            // Texto nuevo pre-cargado con el texto original
            const text = new fabric.IText(block.text, {
                left: block.x0,
                top: block.y0,
                fontSize: Math.round(block.size * 0.75),
                fill: textColorInput.value,
                fontFamily: 'Arial',
                customType: 'overlay'
            });

            text.on('changed', function() {
                updateAnnotationList();
            });

            canvas.add(cover);
            canvas.add(text);
            canvas.setActiveObject(text);
            text.enterEditing();
            updateAnnotationList();
        }

        function addRect(x, y) {
            const rect = new fabric.Rect({
                left: x,
                top: y,
                width: 150,
                height: 80,
                fill: 'transparent',
                stroke: textColorInput.value,
                strokeWidth: 2,
                selectable: true
            });
            rect.customType = 'rect';
            canvas.add(rect);
            canvas.setActiveObject(rect);
            updateAnnotationList();
        }

        function addHighlight(x, y) {
            const rect = new fabric.Rect({
                left: x,
                top: y,
                width: 200,
                height: 20,
                fill: 'rgba(255, 235, 59, 0.4)',
                stroke: 'transparent',
                strokeWidth: 0,
                selectable: true
            });
            rect.customType = 'highlight';
            canvas.add(rect);
            canvas.setActiveObject(rect);
            updateAnnotationList();
        }

        function deleteSelected() {
            const active = canvas.getActiveObject();
            if (!active) return;
            if (active.type === 'activeSelection') {
                active.forEachObject(obj => canvas.remove(obj));
                canvas.discardActiveObject();
            } else {
                canvas.remove(active);
            }
            updateAnnotationList();
            canvas.renderAll();
        }

        function selectTool(tool) {
            currentTool = tool;
            // Reset todos los botones
            ['toolText', 'toolSelect', 'toolRect', 'toolHighlight'].forEach(id => {
                const btn = document.getElementById(id);
                if (btn) btn.classList.remove('tool-active');
            });
            // Activar botón seleccionado
            const activeId = {text: 'toolText', select: 'toolSelect', rect: 'toolRect', highlight: 'toolHighlight'}[tool];
            if (activeId) document.getElementById(activeId).classList.add('tool-active');

            // Configurar canvas según herramienta
            if (tool === 'select') {
                canvas.isDrawingMode = false;
                canvas.selection = true;
                canvas.forEachObject(obj => { obj.selectable = true; obj.evented = true; });
            } else {
                canvas.selection = false;
                canvas.forEachObject(obj => { obj.selectable = tool === 'select'; });
            }
            canvas.renderAll();
        }

        async function fetchPagePreview() {
            if (!pdfInput.files[0]) return;

            // Leer el archivo UNA sola vez como ArrayBuffer
            const fileBuffer = await pdfInput.files[0].arrayBuffer();
            const fileName = pdfInput.files[0].name;
            const fileType = pdfInput.files[0].type || 'application/pdf';

            const makeFormData = () => {
                const fd = new FormData();
                fd.append('pdf_file', new Blob([fileBuffer], { type: fileType }), fileName);
                fd.append('pagina', pageNum.value);
                return fd;
            };

            try {
                const [previewRes, textRes] = await Promise.all([
                    fetch('/api/page_preview', { method: 'POST', body: makeFormData() }),
                    fetch('/api/extract_text', { method: 'POST', body: makeFormData() })
                ]);

                const previewData = await previewRes.json();
                const textData = await textRes.json();

                const rawBlocks = textData.blocks || [];

                if (previewData.total_pages) {
                    totalPages = previewData.total_pages;
                    totalPagesSpan.textContent = totalPages;
                    pageCountDisplay.classList.remove('hidden');
                }

                if (previewData.image) {
                    pdfBase64 = previewData.image;
                    const img = new Image();
                    img.onload = function() {
                        const maxW = 800, maxH = 800;
                        let scale = Math.min(maxW / img.width, maxH / img.height, 1);
                        canvasScale = scale;
                        canvasWidth = img.width * scale;
                        canvasHeight = img.height * scale;
                        canvas.setDimensions({ width: canvasWidth, height: canvasHeight });

                        // Escalar bloques de texto al tamaño real del canvas
                        pdfTextBlocks = rawBlocks.map(b => ({
                            text: b.text,
                            x0: b.x0 * scale,
                            y0: b.y0 * scale,
                            x1: b.x1 * scale,
                            y1: b.y1 * scale,
                            size: b.size * scale
                        }));

                        loadPageAnnotations();
                    };
                    img.src = pdfBase64;
                    saveBtn.disabled = false;
                }
            } catch (e) {
                console.error('Error fetching page preview:', e);
            }
        }

        function saveCurrentPageAnnotations() {
            const pageKey = parseInt(currentPage);
            const objects = canvas.getObjects().filter(o => o.type === 'i-text' || o.type === 'rect');
            pageAnnotations[pageKey] = objects.map(obj => {
                if (obj.type === 'i-text') {
                    return {
                        type: 'text',
                        left: obj.left,
                        top: obj.top,
                        text: obj.text,
                        fontSize: obj.fontSize,
                        fill: obj.fill,
                        width: obj.width,
                        height: obj.height,
                        scaleX: obj.scaleX,
                        scaleY: obj.scaleY
                    };
                } else {
                    return {
                        type: 'rect',
                        left: obj.left,
                        top: obj.top,
                        width: obj.width,
                        height: obj.height,
                        fill: obj.fill,
                        stroke: obj.stroke,
                        strokeWidth: obj.strokeWidth,
                        scaleX: obj.scaleX,
                        scaleY: obj.scaleY,
                        customType: obj.customType
                    };
                }
            });
        }

        function loadPageAnnotations() {
            canvas.clear();
            
            if (pdfBase64) {
                fabric.Image.fromURL(pdfBase64, function(img) {
                    canvas.setBackgroundImage(img, canvas.renderAll.bind(canvas), {
                        scaleX: canvasWidth / img.width,
                        scaleY: canvasHeight / img.height
                    });
                    
                    restoreAnnotations();
                });
            } else {
                canvas.renderAll();
            }
        }

        function restoreAnnotations() {
            if (pageAnnotations[currentPage]) {
                pageAnnotations[currentPage].forEach(data => {
                    if (data.type === 'text' || !data.type) {
                        const text = new fabric.IText(data.text, {
                            left: data.left,
                            top: data.top,
                            fontSize: data.fontSize,
                            fill: data.fill,
                            fontFamily: 'Arial',
                            scaleX: data.scaleX || 1,
                            scaleY: data.scaleY || 1
                        });
                        
                        text.on('changed', function() {
                            updateAnnotationList();
                        });
                        
                        canvas.add(text);
                    } else if (data.type === 'rect') {
                        const rect = new fabric.Rect({
                            left: data.left,
                            top: data.top,
                            width: data.width,
                            height: data.height,
                            fill: data.fill,
                            stroke: data.stroke,
                            strokeWidth: data.strokeWidth,
                            scaleX: data.scaleX || 1,
                            scaleY: data.scaleY || 1
                        });
                        rect.customType = data.customType;
                        canvas.add(rect);
                    }
                });
            }
            updateAnnotationList();
        }

        function switchPage(newPage) {
            saveCurrentPageAnnotations();
            currentPage = parseInt(newPage);
            document.getElementById('pageNum').value = currentPage;
            fetchPagePreview();
        }

        function updateAnnotationList() {
            const objects = canvas.getObjects().filter(o => o.type === 'i-text' || o.type === 'rect');
            
            if (objects.length === 0) {
                annotationList.innerHTML = '<p class="text-xs text-gray-400">Haz clic en el canvas para agregar elementos</p>';
                return;
            }
            
            annotationList.innerHTML = '';
            
            Object.keys(pageAnnotations).forEach(page => {
                const pageAnns = pageAnnotations[page];
                pageAnns.forEach((ann, idx) => {
                    const item = document.createElement('div');
                    item.className = 'text-xs bg-gray-50 p-2 rounded border border-gray-200';
                    
                    const pageBadge = document.createElement('span');
                    pageBadge.className = 'inline-block bg-blue-100 text-blue-700 px-1 rounded mr-1';
                    pageBadge.textContent = 'P' + page;
                    
                    const textPreview = document.createElement('span');
                    textPreview.className = 'text-gray-600';
                    if (ann.type === 'text' || !ann.type) {
                        textPreview.textContent = '📝 ' + (ann.text || '').substring(0, 30) + ((ann.text || '').length > 30 ? '...' : '');
                    } else if (ann.type === 'rect' && ann.customType === 'highlight') {
                        textPreview.textContent = '◼ Resaltar';
                    } else if (ann.type === 'rect' && ann.customType === 'rect') {
                        textPreview.textContent = '▭ Rect';
                    } else {
                        textPreview.textContent = '▭ Rectángulo';
                    }
                    
                    const deleteBtn = document.createElement('button');
                    deleteBtn.className = 'float-right text-red-500 hover:text-red-700';
                    deleteBtn.innerHTML = '×';
                    deleteBtn.onclick = function() {
                        deleteAnnotation(page, idx);
                    };
                    
                    item.appendChild(pageBadge);
                    item.appendChild(textPreview);
                    item.appendChild(deleteBtn);
                    annotationList.appendChild(item);
                });
            });
        }

        function deleteAnnotation(page, idx) {
            if (pageAnnotations[page]) {
                pageAnnotations[page].splice(idx, 1);
            }
            
            if (parseInt(page) === currentPage) {
                loadPageAnnotations();
            } else {
                updateAnnotationList();
            }
        }

        async function saveChanges() {
            if (!pdfInput.files[0]) return;
            
            saveCurrentPageAnnotations();
            
            const annotations = [];
            
            Object.keys(pageAnnotations).forEach(page => {
                const pageAnns = pageAnnotations[page];
                if (pageAnns && pageAnns.length > 0) {
                    pageAnns.forEach(ann => {
                        if (ann.type === 'rect' && ann.customType === 'cover') {
                            annotations.push({
                                tipo: 'cover',
                                pagina: parseInt(page),
                                x0_abs: ann.left,
                                y0_abs: ann.top,
                                x1_abs: ann.left + ann.width * (ann.scaleX || 1),
                                y1_abs: ann.top + ann.height * (ann.scaleY || 1)
                            });
                        } else if (ann.type === 'text') {
                            annotations.push({
                                tipo: 'text',
                                pagina: parseInt(page),
                                texto: ann.text,
                                x_abs: ann.left,
                                y_abs: ann.top,
                                fontsize: ann.fontSize,
                                color: ann.fill
                            });
                        }
                    });
                }
            });
            
            if (annotations.length === 0) {
                alert('No hay anotaciones para guardar');
                return;
            }
            
            const formData = new FormData();
            formData.append('pdf_file', pdfInput.files[0]);
            formData.append('canvas_scale', canvasScale);
            formData.append('anotaciones', JSON.stringify(annotations));
            
            try {
                const response = await fetch('/edit', {
                    method: 'POST',
                    body: formData
                });
                
                if (response.ok) {
                    const result = await response.text();
                    const parser = new DOMParser();
                    const doc = parser.parseFromString(result, 'text/html');
                    const link = doc.querySelector('a[download]');
                    
                    if (link) {
                        downloadLink.href = link.getAttribute('href');
                        downloadLink.download = link.download;
                        downloadArea.classList.remove('hidden');
                    }
                }
            } catch (e) {
                console.error('Error saving PDF:', e);
            }
        }

        pdfInput.addEventListener('change', function() {
            if (this.files[0]) {
                pageAnnotations = {};
                currentPage = 1;
                pageNum.value = 1;
                fetchPagePreview();
            }
        });

        pageNum.addEventListener('change', function() {
            if (pdfInput.files[0] && this.value > 0) {
                switchPage(this.value);
            }
        });

        fontSizeInput.addEventListener('change', function() {
            const activeObj = canvas.getActiveObject();
            if (activeObj && activeObj.type === 'i-text') {
                activeObj.set('fontSize', parseInt(this.value));
                canvas.renderAll();
                updateAnnotationList();
            }
        });

        textColorInput.addEventListener('change', function() {
            const activeObj = canvas.getActiveObject();
            if (activeObj && activeObj.type === 'i-text') {
                activeObj.set('fill', this.value);
                canvas.renderAll();
                updateAnnotationList();
            }
        });

        initCanvas();
    </script>
</body>
</html>
