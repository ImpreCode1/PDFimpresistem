<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Firmar PDF — PDF Impresistem</title>
    <link rel="stylesheet" href="/static/css/impresistem-ui.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
    <style>
        #drawCanvas {
            cursor: crosshair;
            background: #fff;
            border-radius: 6px;
            display: block;
            width: 100%;
        }
        .draw-area {
            border: 1.5px solid rgba(255,255,255,0.12);
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 8px;
            background: #fff;
        }
        .firma-preview {
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 8px;
            padding: 8px;
            margin-bottom: 8px;
            text-align: center;
            font-size: 11px;
            color: rgba(255,255,255,0.3);
            min-height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .firma-preview.has-firma {
            color: #22c55e;
            border-color: rgba(34,197,94,0.25);
            background: rgba(34,197,94,0.06);
        }
    </style>
</head>
<body>
    <div id="sidebar">
        <div class="sidebar-header">
            <div class="sidebar-logo">
                <div class="logo-dot">im</div>
                <span class="logo-label">PDF Impresistem</span>
            </div>
            <h1 class="sidebar-title">Firmar PDF</h1>
        </div>

        <!-- Archivo -->
        <div class="sidebar-section">
            <span class="section-label">Archivo PDF</span>
            <input type="file" id="pdfInput" accept=".pdf" style="display:none;">
            <div class="file-upload-zone" onclick="document.getElementById('pdfInput').click()">
                <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"/>
                </svg>
                <p><strong id="uploadLabel">Seleccionar PDF</strong></p>
            </div>
        </div>

        <!-- Página -->
        <div class="sidebar-section">
            <span class="section-label">Página</span>
            <div class="page-control">
                <button class="page-nav-btn" onclick="changePageNum(-1)">‹</button>
                <input type="number" id="pageNum" value="1" min="1" class="page-num-input">
                <span class="page-total-label" id="pageTotalLabel"></span>
                <button class="page-nav-btn" onclick="changePageNum(1)">›</button>
            </div>
        </div>

        <!-- Firma -->
        <div class="sidebar-section">
            <span class="section-label">Firma</span>
            <div class="tab-row">
                <button type="button" id="tabUpload" onclick="switchTab('upload')" class="tab-btn tab-active">Subir imagen</button>
                <button type="button" id="tabDraw" onclick="switchTab('draw')" class="tab-btn">Dibujar</button>
            </div>

            <div id="tabUploadContent">
                <label class="prop-label">Imagen JPG o PNG</label>
                <input type="file" id="firmaInput" accept=".jpg,.jpeg,.png" class="prop-input" style="padding:4px 8px; cursor:pointer;">
                <div class="firma-preview" id="firmaPreview">Sin firma cargada</div>
            </div>

            <div id="tabDrawContent" style="display:none;">
                <label class="prop-label">Dibuja tu firma</label>
                <div class="draw-area">
                    <canvas id="drawCanvas" width="236" height="110"></canvas>
                </div>
                <div style="display:flex; gap:6px;">
                    <button type="button" onclick="clearDraw()" class="btn-secondary" style="margin:0; flex:1; padding:7px;">
                        Limpiar
                    </button>
                    <button type="button" onclick="useDrawing()" class="btn-primary" style="margin:0; flex:1; padding:7px; background:#22c55e; color:#fff;">
                        Usar firma
                    </button>
                </div>
            </div>
        </div>

        <!-- Info -->
        <div class="sidebar-section">
            <div class="info-box">
                Arrastra la firma sobre el PDF para posicionarla. Puedes redimensionarla desde las esquinas.
            </div>
        </div>

        <!-- Hidden inputs -->
        <input type="hidden" id="pagina" name="pagina" value="1">
        <input type="hidden" id="pos_x" name="pos_x" value="60">
        <input type="hidden" id="pos_y" name="pos_y" value="80">
        <input type="hidden" id="firma_ancho" name="firma_ancho" value="30">
        <input type="hidden" id="firma_alto" name="firma_alto" value="10">

        <div style="flex:1;"></div>

        <div class="sidebar-footer">
            <button type="button" id="submitBtn" onclick="submitSignedPDF()" disabled class="btn-primary">
                Firmar y descargar PDF
            </button>
        </div>
    </div>

    <div id="mainArea">
        <div class="main-topbar">
            <span class="main-hint">Carga un PDF y posiciona la firma arrastrándola sobre el documento</span>
            <span class="main-info" id="zoomLabel">595 × 842 pt</span>
        </div>
        <div class="main-wrapper">
            <div class="canvas-card">
                <canvas id="signCanvas"></canvas>
            </div>
        </div>
        <div class="status-bar">
            <div class="status-item"><div class="status-dot"></div> Listo</div>
            <div class="status-item" id="statusFirma">Sin firma</div>
            <div class="status-item" id="statusPage">Pág 1</div>
        </div>
    </div>

    <script>
        let canvas;
        let pdfBase64 = null;
        let signatureImg = null;
        let signatureFilename = null;
        let pdfFileName = '';
        let isDrawing = false;
        let lastX, lastY;
        let drawCtx;

        const signCanvasEl = document.getElementById('signCanvas');
        const drawCanvasEl = document.getElementById('drawCanvas');
        const pdfInput = document.getElementById('pdfInput');
        const firmaInput = document.getElementById('firmaInput');
        const pageNum = document.getElementById('pageNum');
        const submitBtn = document.getElementById('submitBtn');

        function initCanvas() {
            canvas = new fabric.Canvas('signCanvas', {
                selection: false
            });
            canvas.setDimensions({ width: 595, height: 842 });
            canvas.renderAll();
        }

        function initDrawCanvas() {
            drawCtx = drawCanvasEl.getContext('2d');
            drawCtx.strokeStyle = '#000';
            drawCtx.lineWidth = 2;
            drawCtx.lineCap = 'round';
            drawCtx.lineJoin = 'round';

            drawCanvasEl.addEventListener('mousedown', function(e) {
                isDrawing = true;
                const rect = drawCanvasEl.getBoundingClientRect();
                lastX = e.clientX - rect.left;
                lastY = e.clientY - rect.top;
            });

            drawCanvasEl.addEventListener('mousemove', function(e) {
                if (!isDrawing) return;
                const rect = drawCanvasEl.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                drawCtx.beginPath();
                drawCtx.moveTo(lastX, lastY);
                drawCtx.lineTo(x, y);
                drawCtx.stroke();
                lastX = x;
                lastY = y;
            });

            drawCanvasEl.addEventListener('mouseup', function() { isDrawing = false; });
            drawCanvasEl.addEventListener('mouseout', function() { isDrawing = false; });
        }

        function switchTab(tab) {
            document.getElementById('tabUpload').classList.remove('tab-active');
            document.getElementById('tabDraw').classList.remove('tab-active');
            document.getElementById('tabUploadContent').classList.add('hidden');
            document.getElementById('tabDrawContent').classList.add('hidden');
            
            if (tab === 'upload') {
                document.getElementById('tabUpload').classList.add('tab-active');
                document.getElementById('tabUploadContent').classList.remove('hidden');
            } else {
                document.getElementById('tabDraw').classList.add('tab-active');
                document.getElementById('tabDrawContent').classList.remove('hidden');
            }
        }

        function clearDraw() {
            drawCtx.clearRect(0, 0, drawCanvasEl.width, drawCanvasEl.height);
        }

        async function useDrawing() {
            const dataUrl = drawCanvasEl.toDataURL('image/png');
            const base64 = dataUrl.split(',')[1];
            
            try {
                const response = await fetch('/api/save_signature', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ signature_base64: dataUrl })
                });
                const data = await response.json();
                if (data.filename) {
                    signatureFilename = data.filename;
                    await loadSignatureImage(dataUrl);
                }
            } catch (e) {
                console.error('Error saving signature:', e);
            }
        }

        async function fetchPagePreview() {
            if (!pdfInput.files[0]) return;
            
            const formData = new FormData();
            formData.append('pdf_file', pdfInput.files[0]);
            formData.append('pagina', pageNum.value);
            
            try {
                const response = await fetch('/api/page_preview', {
                    method: 'POST',
                    body: formData
                });
                const data = await response.json();
                
                if (data.image) {
                    pdfBase64 = data.image;
                    const img = new Image();
                    img.onload = function() {
                        const maxW = 800, maxH = 800;
                        let scale = Math.min(maxW / img.width, maxH / img.height, 1);
                        const w = img.width * scale;
                        const h = img.height * scale;
                        canvas.setDimensions({ width: w, height: h });
                        canvas.setBackgroundImage(img, canvas.renderAll.bind(canvas), {
                            scaleX: scale,
                            scaleY: scale,
                            crossOrigin: 'anonymous'
                        });
                    };
                    img.src = pdfBase64;
                    pdfFileName = pdfInput.files[0].name;
                    submitBtn.disabled = !signatureImg;
                }
            } catch (e) {
                console.error('Error fetching page preview:', e);
            }
        }

        async function loadSignatureImage(src) {
            fabric.Image.fromURL(src, function(img) {
                if (signatureImg) {
                    canvas.remove(signatureImg);
                }
                signatureImg = img;
                const scale = Math.min(150 / img.width, 50 / img.height, 1);
                img.set({
                    left: 50,
                    top: 50,
                    scaleX: scale,
                    scaleY: scale
                });
                canvas.add(img);
                canvas.setActiveObject(img);
                canvas.renderAll();
                submitBtn.disabled = !pdfBase64;
            });
        }

        async function submitSignedPDF() {
            if (!pdfInput.files[0] || !signatureImg) return;

            const pdfFile = pdfInput.files[0];
            const FirmaBlob = await (await fetch(signatureImg.getSrc())).blob();
            const FirmaFile = new File([FirmaBlob], signatureFilename || 'firma.png', { type: 'image/png' });

            const obj = signatureImg;
            const canvasW = canvas.getWidth();
            const canvasH = canvas.getHeight();

            const pos_x = Math.round((obj.left / canvasW) * 100);
            const pos_y = Math.round((obj.top / canvasH) * 100);
            const firma_ancho = Math.round((obj.getScaledWidth() / canvasW) * 100);
            const firma_alto = Math.round((obj.getScaledHeight() / canvasH) * 100);

            document.getElementById('pos_x').value = Math.max(0, Math.min(90, pos_x));
            document.getElementById('pos_y').value = Math.max(0, Math.min(90, pos_y));
            document.getElementById('firma_ancho').value = Math.max(5, Math.min(50, firma_ancho));
            document.getElementById('firma_alto').value = Math.max(5, Math.min(30, firma_alto));

            const formData = new FormData();
            formData.append('pdf_file', pdfFile);
            formData.append('firma_file', FirmaFile);
            formData.append('pagina', pageNum.value);
            formData.append('pos_x', Math.max(0, Math.min(90, pos_x)));
            formData.append('pos_y', Math.max(0, Math.min(90, pos_y)));
            formData.append('firma_ancho', Math.max(5, Math.min(50, firma_ancho)));
            formData.append('firma_alto', Math.max(5, Math.min(30, firma_alto)));

            try {
                const response = await fetch('/sign', {
                    method: 'POST',
                    body: formData
                });
                const blob = await response.blob();
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = pdfFileName.replace('.pdf', '_firmado.pdf');
                a.click();
                URL.revokeObjectURL(url);
            } catch (e) {
                console.error('Error submitting:', e);
            }
        }

        pdfInput.addEventListener('change', function() {
            if (this.files[0]) {
                pdfFileName = this.files[0].name;
                document.getElementById('uploadLabel').textContent = pdfFileName;
                fetchPagePreview();
            }
        });

        document.getElementById('pageNum').addEventListener('change', function() {
            document.getElementById('pagina').value = this.value;
            if (pdfInput.files[0]) {
                fetchPagePreview();
            }
        });

        firmaInput.addEventListener('change', function() {
            if (this.files[0]) {
                const file = this.files[0];
                const reader = new FileReader();
                reader.onload = function(e) {
                    signatureFilename = file.name;
                    loadSignatureImage(e.target.result);
                };
                reader.readAsDataURL(file);
            }
        });

        initCanvas();
        initDrawCanvas();

        function changePageNum(delta) {
            const input = document.getElementById('pageNum');
            const newVal = Math.max(1, parseInt(input.value) + delta);
            input.value = newVal;
            document.getElementById('pagina').value = newVal;
            if (pdfInput.files[0]) fetchPagePreview();
        }

        const origSwitchTab = switchTab;
        window.switchTab = function(tab) {
            document.getElementById('tabUpload').classList.remove('tab-active');
            document.getElementById('tabDraw').classList.remove('tab-active');
            document.getElementById('tabUploadContent').style.display = 'none';
            document.getElementById('tabDrawContent').style.display = 'none';
            if (tab === 'upload') {
                document.getElementById('tabUpload').classList.add('tab-active');
                document.getElementById('tabUploadContent').style.display = 'block';
            } else {
                document.getElementById('tabDraw').classList.add('tab-active');
                document.getElementById('tabDrawContent').style.display = 'block';
            }
        };
        switchTab('upload');

    </script>
</body>
</html>
